# SuperTienda — entorno de desarrollo local (Docker Desktop)
# Uso: docker compose --env-file .env.docker up --build
# PostgreSQL: solo red interna Docker (sin publicar puerto en el host).
# Frontend/backend: solo 127.0.0.1

name: supertienda-dev

services:
  db:
    image: postgres:16-alpine
    container_name: supertienda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supertienda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supertienda_dev}
      POSTGRES_DB: ${POSTGRES_DB:-supertienda_dev}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    # Sin ports: el backend alcanza db:5432 por la red compose.
    # Si necesitás psql desde Windows, descomentá y elegí un puerto libre (p.ej. 55432):
    # ports:
    #   - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supertienda} -d ${POSTGRES_DB:-supertienda_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - supertienda_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: supertienda-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-5000}
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-supertienda}:${POSTGRES_PASSWORD:-supertienda_dev}@db:5432/${POSTGRES_DB:-supertienda_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-not-for-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://127.0.0.1:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - backend_keys:/app/keys
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - supertienda_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: supertienda-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:5000}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:5000}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"
    networks:
      - supertienda_net

volumes:
  pgdata_dev:
  backend_node_modules:
  backend_keys:
  frontend_node_modules:
  frontend_next:

networks:
  supertienda_net:
    driver: bridge
