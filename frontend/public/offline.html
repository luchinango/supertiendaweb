<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Sin conexión — SuperTienda</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f3f4f6;
        color: #111827;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
        color: #0f766e;
      }
      p {
        margin: 0 0 1rem;
        line-height: 1.45;
        color: #4b5563;
      }
      a {
        color: #0f766e;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SuperTienda — sin conexión</h1>
      <p>
        Esta ruta no está preparada para uso offline. Conéctate, inicia sesión,
        sincroniza el catálogo y abre la caja; luego prepara la PWA desde
        Ventas.
      </p>
      <p>
        Pantallas operativas preparadas:
        <a href="/ventas">/ventas</a>,
        <a href="/productos">/productos</a>,
        <a href="/inventario">/inventario</a>.
      </p>
    </main>
  </body>
</html>
